# Backing services for local development. Start with: docker compose up -d
# Values come from .env (copy .env.example to .env first).

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      # 3307 on the host, so it doesn't clash with a locally installed MariaDB/MySQL on 3306
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  # S3-compatible object storage for Photos (used from M5 on). RustFS replaces MinIO,
  # which no longer publishes free Docker images. Production will use Cloudflare R2.
  rustfs:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "${S3_PORT:-9000}:9000"          # S3 API
      - "${S3_CONSOLE_PORT:-9001}:9001"  # web console
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
  rustfs-data:
